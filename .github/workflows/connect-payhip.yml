name: Connect Payhip checkout

on:
  push:
    paths:
      - '.github/workflows/connect-payhip.yml'

permissions:
  contents: write

jobs:
  patch-book-link:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Connect eBook button to Payhip
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          path = Path('book.html')
          text = path.read_text(encoding='utf-8')
          needle = 'Get the eBook'
          idx = text.find(needle)
          if idx == -1:
              raise SystemExit('Could not find the eBook CTA text')

          start = text.rfind('<a', 0, idx)
          end = text.find('>', start)
          if start == -1 or end == -1:
              raise SystemExit('Could not locate the anchor tag for the eBook CTA')

          tag = text[start:end + 1]
          match = re.search(r'\bhref\s*=\s*', tag, flags=re.I)
          if match:
              value_start = match.end()
              if value_start >= len(tag):
                  raise SystemExit('Malformed href attribute')
              quote = tag[value_start] if tag[value_start] in ('"', "'") else None
              if quote:
                  value_end = tag.find(quote, value_start + 1)
                  if value_end == -1:
                      raise SystemExit('Unclosed href quote')
                  new_tag = tag[:value_start] + '"https://payhip.com/b/xtdUv"' + tag[value_end + 1:]
              else:
                  value_end = value_start
                  while value_end < len(tag) and not tag[value_end].isspace() and tag[value_end] != '>':
                      value_end += 1
                  new_tag = tag[:value_start] + '"https://payhip.com/b/xtdUv"' + tag[value_end:]
          else:
              new_tag = tag[:-1] + ' href="https://payhip.com/b/xtdUv">'

          updated = text[:start] + new_tag + text[end + 1:]
          path.write_text(updated, encoding='utf-8')
          PY
      - name: Commit change
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add book.html
          git commit -m "Connect eBook button to Payhip"
          git push
