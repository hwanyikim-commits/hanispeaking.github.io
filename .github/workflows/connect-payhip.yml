name: Connect Payhip checkout

on:
  push:
    paths:
      - '.github/workflows/connect-payhip.yml'

permissions:
  contents: write

jobs:
  patch-book-link:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Connect eBook button to Payhip
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          path = Path('book.html')
          text = path.read_text(encoding='utf-8')
          needle = 'Get the eBook'
          idx = text.find(needle)
          if idx == -1:
              raise SystemExit('Could not find the eBook CTA text')

          start = text.rfind('<a', 0, idx)
          end = text.find('>', start)
          if start == -1 or end == -1:
              raise SystemExit('Could not locate the anchor tag for the eBook CTA')

          tag = text[start:end + 1]
          if 'href=' in tag:
              new_tag, count = re.subn(
                  r'href\s*=\s*(["\']).*?\1',
                  'href="https://payhip.com/b/xtdUv"',
                  tag,
                  count=1,
                  flags=re.S,
              )
              if count != 1:
                  raise SystemExit('Could not replace the existing href')
          else:
              new_tag = tag[:-1] + ' href="https://payhip.com/b/xtdUv">'

          updated = text[:start] + new_tag + text[end + 1:]
          path.write_text(updated, encoding='utf-8')
          PY
      - name: Commit change
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add book.html
          git commit -m "Connect eBook button to Payhip"
          git push
