name: Patch book pricing cards

on:
  push:
    paths:
      - '.github/workflows/patch-book-plus.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Update book pricing section
        run: |
          python - <<'PY'
          from pathlib import Path

          p = Path('book.html')
          text = p.read_text(encoding='utf-8')

          marker = 'Daily Quiz + Writing Feedback'
          end_marker = 'Each offer returns to its regular price once its first 50 spots are filled.'
          start = text.find(marker)
          end = text.find(end_marker, start)
          if start == -1 or end == -1:
              raise SystemExit('Could not locate Plus card section')

          seg = text[start:end]
          seg = seg.replace('Daily Quiz + Writing Feedback', 'Real Korean Patterns Plus', 1)
          seg = seg.replace('Instagram Subscription', 'eBook + Audio + Personal Feedback', 1)
          seg = seg.replace('Keep your Korean active with daily quizzes and short writing prompts. Submit your answers to receive personal corrections and feedback.', 'Full Real Korean Patterns Book 1<br>Selected audio<br>Submit 3 practice answers<br>Personal corrections from Hani', 1)
          seg = seg.replace('First 50 subscribers', 'First 50 buyers', 1)
          seg = seg.replace('$5', '$25', 2)
          seg = seg.replace('$10', '$35', 1)
          seg = seg.replace('https://www.instagram.com/amazing_korean_speaking/', 'https://payhip.com/b/Wtp10', 1)
          seg = seg.replace(' target=\\"_blank\\" rel=\\"noopener\\"', '', 1)
          seg = seg.replace('Subscribe on Instagram · $25', 'Get Real Korean Patterns Plus · $25', 1)
          seg = seg.replace('Tap <span style=\\"color:#5b6169;font-weight:600\\">Subscribe<\\u002Fspan> on the profile page.', 'Instant access after purchase.', 1)

          text = text[:start] + seg + text[end:]

          # Ensure the base eBook CTA points to the requested Payhip product.
          text = text.replace('https://payhip.com/b/xtdUv', 'https://payhip.com/b/xtdUv', 1)

          p.write_text(text, encoding='utf-8')
          PY
      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add book.html
          git diff --cached --quiet && exit 0
          git commit -m "Update book Plus offer [skip ci]"
          git push
