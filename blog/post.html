<style>
:root{--cream:#FAF4E7;--ink:#241D18;--body:#5F564C;--amber:#D9942F;--amber-dark:#B9761E;--line:#E8DED0}
*{box-sizing:border-box}body{margin:0;background:#FBFAF7;color:var(--ink);font-family:'Pretendard',-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif}a{text-decoration:none;color:inherit}
.site-nav{background:#FFFDF9;border-bottom:1px solid var(--line);padding:0 24px}.nav-inner{max-width:1120px;height:76px;margin:auto;display:flex;align-items:center;justify-content:space-between;gap:28px}.brand{font-size:21px;font-weight:800}.nav-links{display:flex;gap:30px;align-items:center;font-size:15px;color:#4B443D}.nav-links a{padding:28px 0 24px}.nav-links .active{color:var(--amber-dark);font-weight:800;border-bottom:2px solid var(--amber)}
.wrap{max-width:920px;margin:auto;padding:56px 24px 80px}.back{display:inline-block;color:#766B61;font-size:14px;margin-bottom:28px}.category{font-size:12px;letter-spacing:.16em;text-transform:uppercase;color:var(--amber-dark);font-weight:900;margin-bottom:12px}h1{font-family:'Pretendard',-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;font-size:46px;font-weight:850;letter-spacing:-.035em;line-height:1.16;margin:0 0 13px}.subtitle{font-family:'Pretendard',-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;font-size:19px;font-weight:450;line-height:1.55;color:#6A5E53;margin:0 0 14px}.meta{font-size:13px;color:#8A8077;margin-bottom:34px}.cover{width:100%;aspect-ratio:1.9/1;border-radius:16px;overflow:hidden;background:#EFE7DC;margin-bottom:42px}.cover img{width:100%;height:100%;object-fit:cover}.article{max-width:760px;margin:0 auto;font-size:18px;line-height:1.85;color:#463F39}.article h2,.article h3{font-family:'Pretendard',sans-serif;color:var(--ink);line-height:1.3}.article h2{font-size:27px;font-weight:850;letter-spacing:-.025em;margin:56px 0 24px;padding:0 0 13px;border-bottom:1px solid #DDD1C2;color:#34234D}.article h2::before{content:'•';color:#6B35A8;margin-right:9px}.article h3{font-size:18px;font-weight:800;margin:30px 0 12px;color:#5A2CA0}.article p{margin:0 0 22px}.example-box{margin:16px 0 22px;padding:17px 18px;background:#FFFEFC;border:1px solid #E7DED3;border-radius:12px}.example-box.key-example{background:#FFF1DE;border-color:#F1C98F}.example-box.literal-example{background:#F6F4F1;border-color:#E4DED7}.example-box .example-ko{font-size:19px;font-weight:650;line-height:1.58;color:#2A211B;margin-bottom:5px}.example-box .example-en{font-size:14px;line-height:1.55;color:#7C7064}.example-box .speech-badge{display:inline-block;margin-bottom:9px;padding:3px 8px;border-radius:999px;background:#5A2CA0;color:#fff;font-size:10px;font-weight:900;letter-spacing:.08em;text-transform:uppercase}.example-box.literal-example .speech-badge{background:#8A8178}.example-box.key-example .speech-badge{background:#D98B27}.example-grid,.card-grid,.rule-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px;margin:16px 0 25px}.example-grid.three{grid-template-columns:repeat(3,minmax(0,1fr))}.example-grid .example-box,.card-grid .compare-card,.card-grid .dialogue-card,.rule-grid .rule-card{margin:0;height:100%}.compare-card,.dialogue-card,.rule-card{padding:18px 19px;background:#FFFEFC;border:1px solid #E7DED3;border-radius:12px}.compare-title,.rule-title{font-size:15px;font-weight:850;color:#5A2CA0;margin-bottom:10px}.compare-ko,.dialogue-ko{font-size:18px;font-weight:650;line-height:1.55;color:#2A211B;margin-bottom:7px}.compare-en,.dialogue-en{font-size:14px;line-height:1.5;color:#7C7064}.compare-note{margin-top:12px;padding-top:10px;border-top:1px solid #EEE7DF;font-size:13px;line-height:1.5;color:#6B625A}.dialogue-label{display:inline-block;margin-bottom:10px;padding:3px 8px;border-radius:999px;background:#EFE7FA;color:#5A2CA0;font-size:10px;font-weight:900;letter-spacing:.08em}.rule-grid{grid-template-columns:repeat(3,minmax(0,1fr))}.rule-card{background:#F9F6FC;border-color:#E5DCF0}.rule-line{font-size:14px;line-height:1.65;color:#5C534B}.article ul,.article ol{padding-left:24px;margin:0 0 24px}.article li{margin:8px 0}.article blockquote{margin:28px 0;padding:18px 22px;border-left:4px solid var(--amber);background:#F8F0E4;border-radius:0 10px 10px 0}.article strong{color:#2A211B}.recap-box{margin:44px 0 28px;padding:28px 30px 24px;background:#F4EFFB;border:1px solid #E4D9F3;border-radius:16px}.recap-box h2{margin:0 0 18px;color:#47218E}.recap-box p:last-child{margin-bottom:0}.error{text-align:center;padding:100px 20px;color:#766B61}
.comments{max-width:760px;margin:58px auto 0;padding-top:34px;border-top:1px solid var(--line)}.comments h2{font-family:Georgia,'Times New Roman',serif;font-size:27px;margin:0 0 9px}.comments p{margin:0 0 8px;color:#665D55;font-size:15px;line-height:1.65}.comments .en{color:#81776F}.comment-note{font-size:12px;color:#948A81;margin:0 0 22px}footer{background:#3A2A18;color:#C9BCA8;padding:30px 24px;text-align:center;font-size:13px}
@media(max-width:720px){.nav-inner{height:auto;padding:18px 0;display:block}.brand{display:block;margin-bottom:14px}.nav-links{gap:14px 18px;flex-wrap:wrap;font-size:14px}.nav-links a{padding:4px 0}.wrap{padding:40px 20px 64px}h1{font-size:36px;letter-spacing:-.03em}.subtitle{font-size:17px}.article{font-size:17px}.article h2{font-size:23px;margin-top:48px}.article h3{font-size:16px}.example-grid,.example-grid.three,.card-grid,.rule-grid{grid-template-columns:1fr}.example-box,.compare-card,.dialogue-card,.rule-card{padding:16px}.example-box .example-ko,.compare-ko,.dialogue-ko{font-size:18px}.recap-box{padding:22px 20px}}

<body>
<nav class="site-nav"><div class="nav-inner"><a class="brand" href="../index.html">Hani, Speaking</a><div class="nav-links"><a href="../index.html">Home</a><a href="../free-resources.html">Free Resources</a><a href="../30-day-challenge-landing.html">Free Guide</a><a class="active" href="./">Blog</a><a href="../book.html">Book</a></div></div></nav>
<main id="page"><div class="error">Loading post...</div></main>
<footer>© 2026 Hani, Speaking</footer>
<script>
const REPO='hwanyikim-commits/hanispeaking.github.io',BRANCH='main',DIR='blog/posts';
const esc=s=>String(s||'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[c]));
function fm(text){const m=text.match(/^---\s*\n([\s\S]*?)\n---\s*\n?/);if(!m)return null;const meta={};m[1].split('\n').forEach(line=>{const i=line.indexOf(':');if(i<0)return;meta[line.slice(0,i).trim()]=line.slice(i+1).trim().replace(/^["']|["']$/g,'')});return{meta,body:text.slice(m[0].length)}}
function inline(s){return esc(s).replace(/\*\*(.+?)\*\*/g,'<strong>$1</strong>').replace(/\*(.+?)\*/g,'<em>$1</em>')}
function md(src){const lines=src.replace(/\r/g,'').split('\n');let out='',para=[],list=null;const flush=()=>{if(para.length){out+='<p>'+inline(para.join(' '))+'</p>';para=[]}if(list){out+=list==='ul'?'</ul>':'</ol>';list=null}};for(const raw of lines){const line=raw.trim();if(!line){flush();continue}if(/^\[(example|casual|polite|key|literal)\] /.test(line)){flush();const m=line.match(/^\[(example|casual|polite|key|literal)\]\s+([\s\S]*?)\s*\|\|\s*([\s\S]*)$/);if(m){const type=m[1],cls=type==='key'?' key-example':type==='literal'?' literal-example':type==='casual'?' casual-example':type==='polite'?' polite-example':'';const label=type==='example'?'':(type==='key'?'NATURAL':type.toUpperCase());const badge=label?('<span class="speech-badge">'+label+'</span>'):'';out+='<div class="example-box'+cls+'">'+badge+'<div class="example-ko">'+inline(m[2])+'</div><div class="example-en">'+inline(m[3])+'</div></div>';continue}}if(line.startsWith('[compare] ')){flush();const p=line.slice(10).split(' || ');if(p.length>=4){out+='<div class="compare-card"><div class="compare-title">'+inline(p[0])+'</div><div class="compare-ko">'+inline(p[1])+'</div><div class="compare-en">'+inline(p[2])+'</div><div class="compare-note">'+inline(p.slice(3).join(' || '))+'</div></div>';continue}}if(line.startsWith('[dialogue] ')){flush();const p=line.slice(11).split(' || ');if(p.length>=3){out+='<div class="dialogue-card"><div class="dialogue-label">'+inline(p[0])+'</div><div class="dialogue-ko">'+inline(p[1]).replace(/ \/ /g,'<br>')+'</div><div class="dialogue-en">'+inline(p.slice(2).join(' || ')).replace(/ \/ /g,'<br>')+'</div></div>';continue}}if(line.startsWith('[rule] ')){flush();const p=line.slice(7).split(' || ');if(p.length>=2){const parts=p.slice(1).join(' || ').split(' / ');out+='<div class="rule-card"><div class="rule-title">'+inline(p[0])+'</div>'+parts.map(x=>'<div class="rule-line">'+inline(x)+'</div>').join('')+'</div>';continue}}if(line.startsWith('### ')){flush();out+='<h3>'+inline(line.slice(4))+'</h3>';continue}if(line.startsWith('## ')){flush();out+='<h2>'+inline(line.slice(3))+'</h2>';continue}if(/^[-*] /.test(line)){if(list!=='ul'){flush();out+='<ul>';list='ul'}out+='<li>'+inline(line.slice(2))+'</li>';continue}if(/^\d+\. /.test(line)){if(list!=='ol'){flush();out+='<ol>';list='ol'}out+='<li>'+inline(line.replace(/^\d+\. /,''))+'</li>';continue}if(line.startsWith('> ')){flush();out+='<blockquote>'+inline(line.slice(2))+'</blockquote>';continue}para.push(line)}flush();return out}
function dateFmt(s){const d=new Date(s+'T00:00:00');return isNaN(d)?s:d.toLocaleDateString('en-US',{month:'long',day:'numeric',year:'numeric'})}
function styleRecap(article){const heading=[...article.querySelectorAll('h2')].find(h=>/Quick recap/i.test(h.textContent));if(!heading)return;const box=document.createElement('section');box.className='recap-box';heading.parentNode.insertBefore(box,heading);let node=heading;while(node){if(node!==heading&&node.nodeType===1&&node.tagName==='H2')break;if(node.nodeType===1&&node.tagName==='P'&&node.textContent.trim().startsWith('@'))break;const next=node.nextSibling;box.appendChild(node);node=next}}
function groupRuns(article,selector,wrapperClass){const nodes=[...article.children];let i=0;while(i<nodes.length){if(!nodes[i].matches(selector)){i++;continue}let run=[nodes[i]],j=i+1;while(j<nodes.length&&nodes[j].matches(selector)){run.push(nodes[j]);j++}if(run.length>1){const wrap=document.createElement('div');wrap.className=wrapperClass+(run.length===3?' three':'');run[0].parentNode.insertBefore(wrap,run[0]);run.forEach(n=>wrap.appendChild(n))}i=j}}function layoutCards(article){groupRuns(article,'.example-box','example-grid');groupRuns(article,'.compare-card','card-grid');groupRuns(article,'.dialogue-card','card-grid');groupRuns(article,'.rule-card','rule-grid')}
(async()=>{const file=new URLSearchParams(location.search).get('file');const page=document.getElementById('page');if(!file||!/^[\w.-]+\.md$/.test(file)){page.innerHTML='<div class="error">Post not found.<br><br><a href="./">← Back to Blog</a></div>';return}try{let source='';let r=await fetch('https://api.github.com/repos/'+REPO+'/contents/'+DIR+'/'+encodeURIComponent(file)+'?ref='+BRANCH+'&v='+Date.now(),{cache:'no-store',headers:{Accept:'application/vnd.github.raw+json'}});if(r.ok){source=await r.text()}else{r=await fetch('https://raw.githubusercontent.com/'+REPO+'/'+BRANCH+'/'+DIR+'/'+encodeURIComponent(file)+'?v='+Date.now(),{cache:'no-store'});if(!r.ok)throw 0;source=await r.text()}source=source.replaceAll('\\n\\n','\n\n').replaceAll('\\n','\n');const p=fm(source);if(!p)throw 0;const m=p.meta;document.title=(m.title||'Korean Blog')+' | Hani, Speaking';page.innerHTML='<article class="wrap"><a class="back" href="./">← Back to Blog</a><div class="category">'+esc(m.category||'Patterns')+'</div><h1>'+esc(m.title||'Untitled')+'</h1>'+(m.subtitle?'<p class="subtitle">'+esc(m.subtitle)+'</p>':'')+'<div class="meta">'+dateFmt(m.date||'')+' · '+esc(m.read_time||'5')+' min read</div>'+(m.image?'<div class="cover"><img src="'+esc(m.image)+'" alt=""></div>':'')+'<div class="article">'+md(p.body)+'</div></article>';layoutCards(page.querySelector('.article'));styleRecap(page.querySelector('.article'))}catch(e){page.innerHTML='<div class="error">This post could not be loaded.<br><br><a href="./">← Back to Blog</a></div>'}})();
</script>
<script>
(function(){
  const page=document.getElementById('page');
  const observer=new MutationObserver(function(){
    const article=page.querySelector('.wrap');
    if(!article || article.querySelector('.comments')) return;

    const comments=document.createElement('section');
    comments.className='comments';
    comments.innerHTML='<h2>궁금한 점이 있나요?</h2><p>한국어 표현이 헷갈리거나 예문을 확인하고 싶다면 댓글로 남겨주세요.</p><p class="en">Have a question about this expression? Leave a comment below.</p><div class="comment-note">댓글 작성에는 GitHub 로그인이 필요해요 · Sign in with GitHub to comment.</div>';

    const script=document.createElement('script');
    script.src='https://utteranc.es/client.js';
    script.setAttribute('repo','hwanyikim-commits/hanispeaking.github.io');
    script.setAttribute('issue-term','url');
    script.setAttribute('theme','github-light');
    script.setAttribute('crossorigin','anonymous');
    script.async=true;

    comments.appendChild(script);
    article.appendChild(comments);
    observer.disconnect();
  });

  observer.observe(page,{childList:true,subtree:true});
})();
</script>
