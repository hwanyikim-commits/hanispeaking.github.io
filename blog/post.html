<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Blog Post | Hani, Speaking</title>
<meta name="description" content="Learn natural Korean with Hani, Speaking.">
<link rel="preconnect" href="https://cdn.jsdelivr.net">
<link href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.css" rel="stylesheet">
<style>
:root{--cream:#FAF4E7;--ink:#241D18;--body:#5F564C;--amber:#D9942F;--amber-dark:#B9761E;--line:#E8DED0}
*{box-sizing:border-box}body{margin:0;background:#FBFAF7;color:var(--ink);font-family:'Pretendard',-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif}a{text-decoration:none;color:inherit}
.site-nav{background:#FFFDF9;border-bottom:1px solid var(--line);padding:0 24px}.nav-inner{max-width:1120px;height:76px;margin:auto;display:flex;align-items:center;justify-content:space-between;gap:28px}.brand{font-size:21px;font-weight:800}.nav-links{display:flex;gap:30px;align-items:center;font-size:15px;color:#4B443D}.nav-links a{padding:28px 0 24px}.nav-links .active{color:var(--amber-dark);font-weight:800;border-bottom:2px solid var(--amber)}
.wrap{max-width:920px;margin:auto;padding:56px 24px 80px}.back{display:inline-block;color:#766B61;font-size:14px;margin-bottom:28px}.category{font-size:12px;letter-spacing:.16em;text-transform:uppercase;color:var(--amber-dark);font-weight:900;margin-bottom:12px}h1{font-family:Georgia,'Times New Roman',serif;font-size:48px;line-height:1.08;margin:0 0 14px}.subtitle{font-family:Georgia,'Times New Roman',serif;font-size:22px;line-height:1.45;color:#6A5E53;margin:0 0 14px}.meta{font-size:13px;color:#8A8077;margin-bottom:34px}.cover{width:100%;aspect-ratio:1.9/1;border-radius:16px;overflow:hidden;background:#EFE7DC;margin-bottom:42px}.cover img{width:100%;height:100%;object-fit:cover}.article{max-width:760px;margin:0 auto;font-size:18px;line-height:1.85;color:#463F39}.article h2,.article h3{font-family:Georgia,'Times New Roman',serif;color:var(--ink);margin:42px 0 14px;line-height:1.2}.article h2{font-size:30px}.article h3{font-size:23px}.article p{margin:0 0 22px}.article ul,.article ol{padding-left:24px;margin:0 0 24px}.article li{margin:8px 0}.article blockquote{margin:28px 0;padding:18px 22px;border-left:4px solid var(--amber);background:#F8F0E4;border-radius:0 10px 10px 0}.article strong{color:#2A211B}.error{text-align:center;padding:100px 20px;color:#766B61}
footer{background:#3A2A18;color:#C9BCA8;padding:30px 24px;text-align:center;font-size:13px}
@media(max-width:720px){.nav-inner{height:auto;padding:18px 0;display:block}.brand{display:block;margin-bottom:14px}.nav-links{gap:14px 18px;flex-wrap:wrap;font-size:14px}.nav-links a{padding:4px 0}.wrap{padding:40px 20px 64px}h1{font-size:38px}.article{font-size:17px}}
</style>
</head>
<body>
<nav class="site-nav"><div class="nav-inner"><a class="brand" href="../index.html">Hani, Speaking</a><div class="nav-links"><a href="../index.html">Home</a><a href="../30-day-challenge-landing.html">Challenge</a><a href="#">Free Guide</a><a class="active" href="./">Blog</a><a href="../book.html">Book</a></div></div></nav>
<main id="page"><div class="error">Loading post...</div></main>
<footer>© 2026 Hani, Speaking</footer>
<script>
const REPO='hwanyikim-commits/hanispeaking.github.io',BRANCH='main',DIR='blog/posts';
const esc=s=>String(s||'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[c]));
function fm(text){const m=text.match(/^---\s*\n([\s\S]*?)\n---\s*\n?/);if(!m)return null;const meta={};m[1].split('\n').forEach(line=>{const i=line.indexOf(':');if(i<0)return;meta[line.slice(0,i).trim()]=line.slice(i+1).trim().replace(/^["']|["']$/g,'')});return{meta,body:text.slice(m[0].length)}}
function inline(s){return esc(s).replace(/\*\*(.+?)\*\*/g,'<strong>$1</strong>').replace(/\*(.+?)\*/g,'<em>$1</em>')}
function md(src){const lines=src.replace(/\r/g,'').split('\n');let out='',para=[],list=null;const flush=()=>{if(para.length){out+='<p>'+inline(para.join(' '))+'</p>';para=[]}if(list){out+=list==='ul'?'</ul>':'</ol>';list=null}};for(const raw of lines){const line=raw.trim();if(!line){flush();continue}if(line.startsWith('### ')){flush();out+='<h3>'+inline(line.slice(4))+'</h3>';continue}if(line.startsWith('## ')){flush();out+='<h2>'+inline(line.slice(3))+'</h2>';continue}if(/^[-*] /.test(line)){if(list!=='ul'){flush();out+='<ul>';list='ul'}out+='<li>'+inline(line.slice(2))+'</li>';continue}if(/^\d+\. /.test(line)){if(list!=='ol'){flush();out+='<ol>';list='ol'}out+='<li>'+inline(line.replace(/^\d+\. /,''))+'</li>';continue}if(line.startsWith('> ')){flush();out+='<blockquote>'+inline(line.slice(2))+'</blockquote>';continue}para.push(line)}flush();return out}
function dateFmt(s){const d=new Date(s+'T00:00:00');return isNaN(d)?s:d.toLocaleDateString('en-US',{month:'long',day:'numeric',year:'numeric'})}
(async()=>{const file=new URLSearchParams(location.search).get('file');const page=document.getElementById('page');if(!file||!/^[\w.-]+\.md$/.test(file)){page.innerHTML='<div class="error">Post not found.<br><br><a href="./">← Back to Blog</a></div>';return}try{const r=await fetch('https://raw.githubusercontent.com/'+REPO+'/'+BRANCH+'/'+DIR+'/'+encodeURIComponent(file)+'?v='+Date.now());if(!r.ok)throw 0;const p=fm(await r.text());if(!p)throw 0;const m=p.meta;document.title=(m.title||'Korean Blog')+' | Hani, Speaking';page.innerHTML='<article class="wrap"><a class="back" href="./">← Back to Blog</a><div class="category">'+esc(m.category||'Patterns')+'</div><h1>'+esc(m.title||'Untitled')+'</h1>'+(m.subtitle?'<p class="subtitle">'+esc(m.subtitle)+'</p>':'')+'<div class="meta">'+dateFmt(m.date||'')+' · '+esc(m.read_time||'5')+' min read</div>'+(m.image?'<div class="cover"><img src="'+esc(m.image)+'" alt=""></div>':'')+'<div class="article">'+md(p.body)+'</div></article>'}catch(e){page.innerHTML='<div class="error">This post could not be loaded.<br><br><a href="./">← Back to Blog</a></div>'}})();
</script>
</body>
</html>
